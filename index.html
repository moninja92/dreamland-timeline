<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dreamland Timeline</title>
  <meta name="description" content="Declassified timeline of the Dreamland world, 1840 to 2000.">
  <meta name="theme-color" content="#0E1114">
  <meta property="og:title" content="Dreamland Timeline">
  <meta property="og:description" content="Declassified timeline of the Dreamland world, 1840 to 2000.">
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong one. Dark is the default.
    try { if (localStorage.getItem("dreamland-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Special+Elite&display=swap">
</head>
<body>
  <div class="clearance" id="clearance" role="status">
    <span>Dreamland Archive</span><span class="sep">//</span><span>Clearance: <b id="clearance-level">PUBLIC</b></span>
  </div>

  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="lockup">
        <svg class="emblem" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="10" y="8" width="9" height="48" fill="currentColor"/>
          <path d="M23 8H32A24 24 0 0 1 32 56H23V50H32A18 18 0 0 0 32 14H23Z" fill="currentColor"/>
          <path class="sweep" d="M31.03 20.53A14 14 0 0 1 32 42.72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path class="beam" d="M23 32L35.26 21.72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="23" cy="32" r="3" fill="currentColor"/>
        </svg>
        <h1 class="wordmark" aria-label="Dreamland"><span>DREAM</span><span class="land">LAND</span></h1>
        </div>
        <div class="brand-sub">
          <span class="sub-title">Timeline Archive</span>
          <span class="sub">1840.01.01 → 2000.12.28 · 28-day months · 336-day years</span>
        </div>
      </div>
      <div class="controls">
        <label class="search" for="q">
          <span class="search-label">Records request</span>
          <input id="q" type="search" placeholder="Search events, characters, years" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <label class="switch" for="spoilers">
          <input id="spoilers" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Show spoilers</span>
        </label>
        <button class="theme-btn" id="theme" type="button">Light mode</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chips" id="branches" hidden></div>
    </header>

    <nav class="era" id="era" aria-label="Entries per decade. Select a decade to jump to it."></nav>

    <main class="reader">
      <section class="ledger">
        <div class="count" id="count">Retrieving files…</div>
        <div id="list"></div>
      </section>
      <aside class="dossier" id="dossier" hidden></aside>
    </main>

    <footer class="note" id="status"></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
