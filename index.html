<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dreamland Timeline</title>
  <meta name="description" content="Searchable timeline of the Dreamland world, 1840 to 2000.">
  <meta property="og:title" content="Dreamland Timeline">
  <meta property="og:description" content="Searchable timeline of the Dreamland world, 1840 to 2000.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Dreamland Timeline</h1>
        <span class="sub">1840 → 2000 · 28-day months · 336-day years</span>
      </div>
      <div class="controls">
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search events, characters, years" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <label class="toggle" for="spoilers"><input id="spoilers" type="checkbox"> Show spoilers</label>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chips" id="branches" hidden></div>
    </header>

    <nav class="era" id="era" aria-label="Jump to decade"></nav>

    <main class="reader">
      <section class="ledger">
        <div class="count" id="count">Loading the timeline…</div>
        <div id="list"></div>
      </section>
      <aside class="dossier" id="dossier" hidden></aside>
    </main>

    <footer class="note" id="status"></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
